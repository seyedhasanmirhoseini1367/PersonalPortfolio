<style>
/* LearningJourney: built on the site's theme tokens (base.html). Lake blue + lingonberry accents. */
.lj{--lj-lake:#2f8fd8;--lj-berry:#d9546b;--lj-moss:#3fae74;--lj-amber:#e0a43a;
    max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:8px 48px}
.lj [hidden]{display:none!important}
.lj h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800;margin:0;text-wrap:balance}
.lj h2{font-size:1.2rem;font-weight:800;margin:0}
.lj p{margin:0}
.lj .muted{color:var(--text-muted)}
.lj-eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lj-lake)}
.lj-head{display:flex;flex-direction:column;gap:8px}
.lj-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lj-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.lj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lj-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;
  font-weight:700;font-size:.95rem;background:var(--lj-lake);color:#fff;text-decoration:none;cursor:pointer;min-height:44px}
.lj-btn:hover{filter:brightness(1.08);color:#fff}
.lj-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lj-btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.lj-btn.berry{background:var(--lj-berry)}
.lj-btn.moss{background:var(--lj-moss)}
.lj-btn[disabled]{opacity:.5;cursor:not-allowed}
.lj-input,.lj textarea,.lj select{width:100%;background:var(--bg-input);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
.lj textarea{min-height:140px;resize:vertical}
.lj label{font-weight:700;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.lj-form{display:flex;flex-direction:column;gap:14px}
.lj-inline{display:flex;gap:8px;flex-wrap:wrap}
.lj-inline .lj-input{flex:1;min-width:160px}
.lj-stat{display:flex;flex-direction:column;gap:2px}
.lj-stat b{font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.lj-stat span{font-size:.85rem;color:var(--text-muted)}
.lj-stats{display:flex;flex-wrap:wrap;gap:22px}
.lj-chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;
  border:1px solid var(--border);color:var(--text-muted);white-space:nowrap}
.lj-chip.high{color:var(--lj-moss);border-color:var(--lj-moss)}
.lj-chip.medium{color:var(--lj-amber);border-color:var(--lj-amber)}
.lj-chip.low{color:var(--lj-berry);border-color:var(--lj-berry)}
.lj-chip.draft{color:var(--lj-amber);border-color:var(--lj-amber)}
.lj-chip.processing{color:var(--lj-lake);border-color:var(--lj-lake)}
.lj-chip.failed{color:var(--lj-berry);border-color:var(--lj-berry)}
.lj-chip.published{color:var(--lj-moss);border-color:var(--lj-moss)}
.lj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lj-list a.lj-li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--border);
  border-radius:12px;text-decoration:none;color:var(--text);background:var(--bg-card)}
.lj-list a.lj-li:hover{border-color:var(--lj-lake)}
.lj-li small{color:var(--text-muted)}
.lj-code{font-family:ui-monospace,Consolas,monospace;font-size:1.4rem;font-weight:800;letter-spacing:.2em;color:var(--lj-lake)}
.fi{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--lj-lake)}
.lj-extra{unicode-bidi:isolate;color:var(--text-muted)}
.lj-extra[lang="fa"],.lj-extra[lang="ar"],.lj-extra[lang="ur"]{font-family:Vazirmatn,Tahoma,sans-serif}
.lj-msg{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card)}
.lj-msg.error{border-color:var(--lj-berry);color:var(--lj-berry)}
.lj-msg.success{border-color:var(--lj-moss)}
.lj-empty{border:1px dashed var(--border);border-radius:14px;padding:22px;text-align:center;color:var(--text-muted)}
.lj-board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:rank}
.lj-nav{display:flex;gap:4px;border:1px solid var(--border);background:var(--bg-card);border-radius:14px;padding:4px;overflow-x:auto}
.lj-nav a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:10px;text-decoration:none;
  color:var(--text-muted);font-weight:700;font-size:.9rem;white-space:nowrap;min-height:40px}
.lj-nav a:hover{color:var(--text)}
.lj-nav a[aria-current="page"]{background:var(--lj-lake);color:#fff}
@media (max-width:560px){.lj-nav a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px}}
.lj-spaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lj-space{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--border);border-radius:14px;text-decoration:none;
  color:var(--text);background:var(--bg-card);min-width:0}
.lj-space:hover{border-color:var(--lj-lake);color:var(--text)}
.lj-space .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--lj-lake) 14%,transparent);color:var(--lj-lake)}
.lj-space small{color:var(--text-muted)}
.lj-tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lj-tips li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px}
.lj-tips li>i{color:var(--lj-lake);width:20px;text-align:center}
.lj-tips li span{flex:1}
.lj-tips a{font-weight:700;white-space:nowrap}
.lj-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:70px}
.lj-week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.lj-week i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--lj-lake);min-height:3px}
.lj-week small{font-size:.7rem;color:var(--text-muted)}
.lj-ref{font-size:.75rem;color:var(--text-muted);display:inline-flex;gap:4px;align-items:center}
.lj-quote{font-size:.85rem;color:var(--text-muted);border-inline-start:3px solid var(--border);padding-inline-start:8px;font-style:italic}
details.lj-more summary{cursor:pointer;font-weight:700}
.lj-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.85rem;color:var(--text-muted)}
.lj-crumbs a{color:var(--lj-lake);text-decoration:none;font-weight:600}
.lj-crumbs a:hover{text-decoration:underline}
.lj-crumbs i{font-size:.6rem;opacity:.6}
.lj-crumbs [aria-current]{color:var(--text);font-weight:700}
.lj-stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;counter-reset:s}
.lj-stepper li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.8rem;font-weight:700;color:var(--text-muted);position:relative}
.lj-stepper li:not(:last-child)::after{content:"";position:absolute;top:16px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--border)}
.lj-stepper li.done:not(:last-child)::after{background:var(--lj-moss)}
.lj-stepper .n{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--border);background:var(--bg-card)}
.lj-stepper li.done .n{background:var(--lj-moss);border-color:var(--lj-moss);color:#fff}
.lj-stepper li.now .n{border-color:var(--lj-lake);color:var(--lj-lake);box-shadow:0 0 0 4px color-mix(in srgb,var(--lj-lake) 18%,transparent)}
.lj-stepper li.now{color:var(--text)}
.lj-big{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;border:2px solid var(--lj-moss);
  background:color-mix(in srgb,var(--lj-moss) 8%,var(--bg-card))}
.lj-big b{font-size:1.15rem}
.lj-subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lj-subject{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--border);border-radius:16px;text-decoration:none;
  color:var(--text);background:var(--bg-card);min-width:0;min-height:150px}
.lj-subject:hover{border-color:var(--lj-lake);color:var(--text);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.lj-subject .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  background:color-mix(in srgb,var(--lj-lake) 14%,transparent);color:var(--lj-lake)}
.lj-subject small{color:var(--text-muted)}
.lj-subject .meta{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.lj-subject.new{border-style:dashed;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.lj-lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lj-lesson{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text)}
.lj-lesson:hover{border-color:var(--lj-lake);color:var(--text)}
.lj-lesson .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.lj-lesson .ic.published{background:color-mix(in srgb,var(--lj-moss) 16%,transparent);color:var(--lj-moss)}
.lj-lesson .ic.draft,.lj-lesson .ic.empty{background:color-mix(in srgb,var(--lj-amber) 18%,transparent);color:#a06f12}
.lj-lesson .ic.processing{background:color-mix(in srgb,var(--lj-lake) 16%,transparent);color:var(--lj-lake)}
.lj-lesson .ic.failed{background:color-mix(in srgb,var(--lj-berry) 16%,transparent);color:var(--lj-berry)}
.lj-lesson .main{flex:1;min-width:0}
.lj-lesson small{color:var(--text-muted)}
.lj-lesson .next{font-size:.82rem;font-weight:700;color:var(--lj-lake);white-space:nowrap}
.lj-chip.empty{color:#a06f12;border-color:var(--lj-amber)}
.lj-picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lj-pick{display:flex;flex-direction:column;gap:8px;padding:18px;border:2px solid var(--border);border-radius:16px;text-decoration:none;color:var(--text);background:var(--bg-card)}
.lj-pick:hover{border-color:var(--lj-lake);color:var(--text)}
.lj-pick.rec{border-color:var(--lj-moss)}
.lj-pick i{font-size:1.5rem;color:var(--lj-lake)}
.lj-pick small{color:var(--text-muted);line-height:1.45}
@media (max-width:560px){.lj-stepper .t{font-size:.68rem}.lj-lesson .next{display:none}}
.lj-speak{border:1px solid var(--border);background:transparent;color:var(--lj-lake);border-radius:999px;width:38px;height:38px;cursor:pointer}
@media (max-width:560px){.lj-card{padding:14px}.lj-stat b{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){.lj *{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap">
