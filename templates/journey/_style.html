<style>
/* LearningJourney: built on the site's theme tokens (base.html). Lake blue + lingonberry accents. */
.lj{--lj-lake:#2f8fd8;--lj-berry:#d9546b;--lj-moss:#3fae74;--lj-amber:#e0a43a;
    max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:8px 48px}
.lj [hidden]{display:none!important}
.lj h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:800;margin:0;text-wrap:balance}
.lj h2{font-size:1.2rem;font-weight:800;margin:0}
.lj p{margin:0}
.lj .muted{color:var(--text-muted)}
.lj-eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lj-lake)}
.lj-head{display:flex;flex-direction:column;gap:8px}
.lj-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lj-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.lj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lj-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;
  font-weight:700;font-size:.95rem;background:var(--lj-lake);color:#fff;text-decoration:none;cursor:pointer;min-height:44px}
.lj-btn:hover{filter:brightness(1.08);color:#fff}
.lj-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lj-btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.lj-btn.berry{background:var(--lj-berry)}
.lj-btn.moss{background:var(--lj-moss)}
.lj-btn[disabled]{opacity:.5;cursor:not-allowed}
.lj-input,.lj textarea,.lj select{width:100%;background:var(--bg-input);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
.lj textarea{min-height:140px;resize:vertical}
.lj label{font-weight:700;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.lj-form{display:flex;flex-direction:column;gap:14px}
.lj-inline{display:flex;gap:8px;flex-wrap:wrap}
.lj-inline .lj-input{flex:1;min-width:160px}
.lj-stat{display:flex;flex-direction:column;gap:2px}
.lj-stat b{font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.lj-stat span{font-size:.85rem;color:var(--text-muted)}
.lj-stats{display:flex;flex-wrap:wrap;gap:22px}
.lj-chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;
  border:1px solid var(--border);color:var(--text-muted);white-space:nowrap}
.lj-chip.high{color:var(--lj-moss);border-color:var(--lj-moss)}
.lj-chip.medium{color:var(--lj-amber);border-color:var(--lj-amber)}
.lj-chip.low{color:var(--lj-berry);border-color:var(--lj-berry)}
.lj-chip.draft{color:var(--lj-amber);border-color:var(--lj-amber)}
.lj-chip.processing{color:var(--lj-lake);border-color:var(--lj-lake)}
.lj-chip.failed{color:var(--lj-berry);border-color:var(--lj-berry)}
.lj-chip.published{color:var(--lj-moss);border-color:var(--lj-moss)}
.lj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lj-list a.lj-li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--border);
  border-radius:12px;text-decoration:none;color:var(--text);background:var(--bg-card)}
.lj-list a.lj-li:hover{border-color:var(--lj-lake)}
.lj-li small{color:var(--text-muted)}
.lj-code{font-family:ui-monospace,Consolas,monospace;font-size:1.4rem;font-weight:800;letter-spacing:.2em;color:var(--lj-lake)}
.fi{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--lj-lake)}
.fa{direction:rtl;unicode-bidi:isolate;font-family:Vazirmatn,Tahoma,sans-serif}
.lj-msg{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg-card)}
.lj-msg.error{border-color:var(--lj-berry);color:var(--lj-berry)}
.lj-msg.success{border-color:var(--lj-moss)}
.lj-empty{border:1px dashed var(--border);border-radius:14px;padding:22px;text-align:center;color:var(--text-muted)}
.lj-speak{border:1px solid var(--border);background:transparent;color:var(--lj-lake);border-radius:999px;width:38px;height:38px;cursor:pointer}
@media (max-width:560px){.lj-card{padding:14px}.lj-stat b{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){.lj *{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap">
