<script>
/* Text-to-speech with the phone's or browser's own voice (free, no AI tokens).
   The language comes from the group's subject; an empty language means no speech. */
window.ljSpeak = function (text, lang) {
    lang = lang === undefined ? (window.LJ_SPEECH || '') : lang;
    if (!lang || !('speechSynthesis' in window) || !text) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    const base = lang.slice(0, 2).toLowerCase();
    const voice = speechSynthesis.getVoices().find(v => (v.lang || '').toLowerCase().startsWith(base));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
    return true;
};
if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
