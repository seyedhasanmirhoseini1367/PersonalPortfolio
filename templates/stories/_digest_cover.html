{# Generated cover for the daily digest / weekly roundup (no image file needed). #}
<a href="{% url 'stories:story_detail' story.slug %}" class="digest-cover{% if story.is_weekly %} weekly{% elif story.is_repos %} repos{% endif %}" aria-hidden="true" tabindex="-1">
{% with c=story.digest_cover %}
    <span class="digest-cover-kicker">{{ c.kicker }}</span>
    <span class="digest-cover-day">{{ c.big }}</span>
    <span class="digest-cover-month">{{ c.small }}</span>
{% endwith %}
    <i class="{% if story.is_weekly %}fas fa-trophy{% elif story.is_repos %}fab fa-github{% else %}fas fa-newspaper{% endif %} digest-cover-icon"></i>
</a>
<style>
.digest-cover { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    gap: .1rem; padding: .9rem 1rem; min-height: 100%; text-decoration: none; color: #fff; overflow: hidden;
    background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.12) 1px, transparent 0) 0 0 / 14px 14px,
                linear-gradient(140deg, #1a1640, #6d5dfc 70%, #00b8e6); }
.digest-cover.repos { background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.12) 1px, transparent 0) 0 0 / 14px 14px,
                linear-gradient(140deg, #0b1f1a, #0f766e 60%, #22c55e); }
.digest-cover.weekly { background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.12) 1px, transparent 0) 0 0 / 14px 14px,
                linear-gradient(140deg, #1a1640, #b4329a 65%, #f59e0b); }
.digest-cover-kicker { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.digest-cover-day { font-size: 2.1rem; font-weight: 800; line-height: 1; }
.digest-cover-month { font-size: .8rem; opacity: .9; }
.digest-cover-icon { position: absolute; right: .7rem; bottom: .6rem; font-size: 1.4rem; opacity: .35; }
@media (max-width: 768px) {
    .digest-cover { flex-direction: row; align-items: baseline; gap: .5rem; min-height: 0; padding: .7rem 1rem; }
    .digest-cover-day { font-size: 1.4rem; }
}
</style>
